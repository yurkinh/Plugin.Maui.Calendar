version: 2

updates:
  # Appium and its drivers for the UI tests (tests/Plugin.Maui.Calendar.UITests). They are pinned and bundle their
  # own dependencies, so a vulnerable dependency is only fixed by a new version of the package that bundles it.
  # One pull request a week brings the new versions of all of them; a new major version gets a pull request of
  # its own, because the drivers have to support the Appium they run on.
  - package-ecosystem: npm
    directory: /tests/Plugin.Maui.Calendar.UITests
    schedule:
      interval: weekly
    groups:
      appium:
        patterns:
          - "appium*"
        update-types:
          - minor
          - patch
    ignore:
      # The UI tests stay on Appium 3 until every driver supports Appium 4: appium-windows-driver has no Appium 4
      # version yet, while appium-xcuitest-driver 13, appium-uiautomator2-driver 9 and appium-mac2-driver 5 need it.
      # Remove these entries together when moving to Appium 4.
      - dependency-name: appium
        versions:
          - ">=4"
      - dependency-name: appium-mac2-driver
        versions:
          - ">=5"
      - dependency-name: appium-xcuitest-driver
        versions:
          - ">=13"
      - dependency-name: appium-uiautomator2-driver
        versions:
          - ">=9"
    commit-message:
      prefix: test
