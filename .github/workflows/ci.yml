name: Build for CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

# A new push to a pull request cancels the run for the previous one; every merge into main is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-plugin-ci:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Install .NET MAUI
      run: dotnet workload install maui
    - name: Build
      # Only the library: the root solution also holds the sample app, which cannot be built for
      # iOS/Mac Catalyst on Windows (ci-sample.yml builds it for Android and Windows). The test
      # project is built by the next step. dotnet build rather than the msbuild of Visual Studio,
      # which is older than the MSBuild the .NET 10 SDK needs.
      run: dotnet build src\Plugin.Maui.Calendar\Plugin.Maui.Calendar.csproj -c Release
    - name: Run Unit Tests
      # Fails when the line or branch coverage of the library drops below 100% (see the test project).
      # In Debug: in a Release build the compiler splits some conditions into more branches than the
      # source has, so the branch coverage measured there does not match the source.
      run: dotnet test tests\Plugin.Maui.Calendar.Tests\Plugin.Maui.Calendar.Tests.csproj --logger trx /p:CollectCoverage=true
    - name: Upload Test Results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: test-results
        path: tests/Plugin.Maui.Calendar.Tests/TestResults/
    - name: Upload Coverage Reports
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: coverage-report
        path: tests/Plugin.Maui.Calendar.Tests/TestResults/coverage/coverage.cobertura.xml

  check-ai-skill:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Check that the AI skill matches llms-full.txt
      # The skill of the maui-calendar agent plugin is llms-full.txt with front matter on top, so
      # agents get the same reference from the plugin as from the NuGet package.
      run: |
        if ! sed '1,/^---$/d' plugins/maui-calendar/skills/maui-calendar/SKILL.md | sed '1{/^$/d;}' | diff - llms-full.txt; then
          echo "::error file=plugins/maui-calendar/skills/maui-calendar/SKILL.md::SKILL.md differs from llms-full.txt. Copy llms-full.txt into it below the front matter."
          exit 1
        fi
