name: Create a release on NuGet

on:
  workflow_dispatch:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"    
jobs:
  release-nuget:
  
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
      - name: Verify commit exists in origin/main
        run: |
          git fetch --no-tags --prune --depth=1 origin +refs/heads/*:refs/remotes/origin/*
          git branch --remote --contains | grep origin/main
      # A v1.2.3 tag packs version 1.2.3; a manual run packs the PackageVersion of the project.
      - name: Take the package version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "PACK_VERSION=-p:PackageVersion=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
         dotnet-version: 10.0.x
      - name: Install .NET MAUI
        run: dotnet workload install maui      
      - name: Build
        run: dotnet build src\Plugin.Maui.Calendar\Plugin.Maui.Calendar.slnx -c Release 
      - name: Pack
        run: dotnet pack src\Plugin.Maui.Calendar\Plugin.Maui.Calendar.slnx -c Release --no-build --output . ${{ env.PACK_VERSION }}
      - name: Push
        run: dotnet nuget push Plugin.Maui.Calendar.*.nupkg -s https://api.nuget.org/v3/index.json -k ${{ secrets.NUGET_API_KEY }}
        env:
          GITHUB_TOKEN: ${{ secrets.NUGET_API_KEY }}
